name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Moon env (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup Moon env (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup Moon env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: Setup Moon compatibility wrapper
        run: |
          REAL_MOON=$(which moon)
          echo "Real moon path: $REAL_MOON"
          mkdir -p $HOME/.bin
          cat << EOF > $HOME/.bin/moon
#!/bin/bash
CMD="\$1"
ARGS=()
for arg in "\$@"; do
  if [ "\$arg" = "--deny-warn" ] && { [ "\$CMD" = "fmt" ] || [ "\$CMD" = "info" ]; }; then
    continue
  fi
  ARGS+=("\$arg")
done

if [ "\$CMD" = "fmt" ]; then
  HAS_CHECK=false
  for arg in "\${ARGS[@]}"; do
    if [ "\$arg" = "--check" ]; then
      HAS_CHECK=true
    fi
  done
  if [ "\$HAS_CHECK" = "false" ]; then
    ARGS+=("--check")
  fi
fi

exec "$REAL_MOON" "\${ARGS[@]}"
EOF
          chmod +x $HOME/.bin/moon
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Moon check
        run: |
          moon check --deny-warn

      - name: Moon format check
        run: |
          moon fmt --deny-warn

      - name: Moon info check
        run: |
          moon info --deny-warn

      - name: Moon test
        run: |
          moon test --deny-warn

      - name: Verify no uncommitted changes
        run: |
          git diff --exit-code
